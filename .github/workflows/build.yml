name: Сборка APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk "CourierRadar-${{ github.run_number }}.apk"

      - name: Сохранить APK в сборке
        uses: actions/upload-artifact@v4
        with:
          name: CourierRadar-${{ github.run_number }}
          path: CourierRadar-${{ github.run_number }}.apk

      - name: Опубликовать релиз со ссылкой на APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "CourierRadar-${{ github.run_number }}.apk" \
            --target "${{ github.sha }}" \
            --title "Сборка ${{ github.run_number }}" \
            --notes "Скачай APK ниже и установи на Android." \
            --latest
